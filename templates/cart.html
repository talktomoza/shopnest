<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - ShopNest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }
        header {
            background: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header a {
            color: white;
            text-decoration: none;
        }
        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .box {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #b12704;
            margin-top: 20px;
        }
        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #232f3e;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">ShopNest</a></h1>
    </header>
    <main>
        <a class="back" href="/">&larr; Continue shopping</a>
        <div class="box">
            <h2>Your Cart ({{ cart_count }})</h2>
            {% if items %}
            <table>
                <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                </tr>
                {% for item in items %}
                <tr>
                    <td>{{ item.product.name }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>৳ {{ item.subtotal }}</td>
                </tr>
                {% endfor %}
            </table>
            <p class="total">Total: ৳ {{ total }}</p>
            {% else %}
            <p>Your cart is empty.</p>
            {% endif %}
        </div>
    </main>
</body>
</html>
