<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - ShopNest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }
        header {
            background: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header a {
            color: white;
            text-decoration: none;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .detail {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .price {
            color: #b12704;
            font-weight: bold;
            font-size: 22px;
        }
        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #232f3e;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">ShopNest</a></h1>
    </header>
    <main>
        <a class="back" href="/">&larr; Back to products</a>
        <div class="detail">
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <p class="price">৳ {{ product.price }}</p>
        </div>
    </main>
</body>
</html>
