<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }
        header {
            background: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        h2 {
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            margin-top: 0;
        }
        .price {
            color: #b12704;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ShopNest</h1>
    </header>
    <main>
        <h2>Our Products</h2>
        <div class="grid">
            {% for product in products %}
            <div class="card">
                <h3>{{ product.name }}</h3>
                <p>{{ product.description }}</p>
                <p class="price">৳ {{ product.price }}</p>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
